name: Brand portal

# Tests and builds the portal on every push and pull request. On the default branch it also
# deploys to Cloudflare, once the repository has the settings below. Until then the deploy job
# says what's missing and skips, so a fresh copy of the template stays green.
#
# Repository settings (Settings > Secrets and variables > Actions); docs/SETUP.md has the clicks:
#   secret   CLOUDFLARE_API_TOKEN   account token: Workers Scripts, Workers R2 Storage,
#                                   Workers Routes (zone), Access: Apps and Policies, all Edit.
#                                   Create it with the link from `npm run token-url`.
#   variable CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that holds the domain
#   variable PORTAL_DOMAIN          e.g. brand.example.com (omit to use workers.dev only)
#   variable ACCESS_AUD             AUD tag of the workers.dev Access app (after the first deploy)
#   variable ACCESS_TEAM            optional: Zero Trust team name; the pipeline works it out itself
# Until ACCESS_AUD is set the Worker refuses every request (it fails closed).

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prune:
        description: Remove people not on the list (access-users.txt)
        type: boolean
        default: false

concurrency:
  group: brand-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - name: Tests
        run: npm test
      - name: Kit check
        run: npm run check
      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PORTAL_DOMAIN: ${{ vars.PORTAL_DOMAIN }}
      ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v5
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Not deploying: add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable (docs/SETUP.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            if [ -z "$ACCESS_AUD" ]; then
              echo "::warning::ACCESS_AUD not set: the portal deploys locked. Enable Cloudflare Access on the Worker's workers.dev URL, then set ACCESS_AUD (docs/SETUP.md step 5)."
            fi
          fi
      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci
      - name: Check the Zero Trust team name
        if: steps.cfg.outputs.ready == 'true' && env.ACCESS_AUD != ''
        run: node resolve-access-team.mjs
      - name: Access application for the custom domain
        if: steps.cfg.outputs.ready == 'true' && env.PORTAL_DOMAIN != '' && env.ACCESS_AUD != ''
        run: node ensure-access-app.mjs
      - name: Build file list and thumbnails
        if: steps.cfg.outputs.ready == 'true'
        run: node build.mjs
      - name: Upload changed files to R2
        if: steps.cfg.outputs.ready == 'true'
        run: node sync-r2.mjs
      - name: Deploy Worker
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler deploy -c wrangler.generated.json
      - name: Check the portal is locked to signed-out visitors
        if: steps.cfg.outputs.ready == 'true' && env.PORTAL_DOMAIN != '' && env.ACCESS_AUD != ''
        env:
          VERIFY_WAIT: "300"
        run: node ../scripts/verify-live.mjs "$PORTAL_DOMAIN"

  # Copies access-users.txt into the Access policy. Separate from deploy, so a token without the
  # Access permission shows up as its own failure and never blocks publishing files.
  access:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.ACCESS_AUD != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: portal
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ACCESS_POLICY_NAME: ${{ vars.ACCESS_POLICY_NAME }}
      ACCESS_PRUNE: ${{ inputs.prune && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update who can sign in
        run: node sync-access.mjs
