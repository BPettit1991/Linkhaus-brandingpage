<!doctype html>
<html lang="{{LOCALE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{SHORT_NAME}} {{PORTAL_TITLE}}</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top__inner">
    <a class="brand" href="#" aria-label="{{SHORT_NAME}} {{PORTAL_TITLE}} home"><img src="logo.svg" alt="{{BRAND_NAME}}"></a>
    <div class="top__title"><span class="eyebrow">Master files</span><h1>{{PORTAL_TITLE}}</h1></div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search files" autocomplete="off" aria-label="Search files">
    </label>
  </div>
  <nav class="cats" id="cats" aria-label="Categories"></nav>
</header>

<main class="wrap">
  <section id="colours" class="swatches" hidden aria-label="Brand colours"></section>
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No files match that search.</p>
</main>

<footer class="foot">
  <span>{{BRAND_NAME}} · Brand master files</span>
  <span id="updated"></span>
</footer>

<dialog class="viewer" id="viewer" aria-labelledby="vTitle">
  <div class="viewer__stage" id="vStage"></div>
  <aside class="viewer__side">
    <div class="viewer__nav">
      <button class="icon-btn" id="vPrev" aria-label="Previous file"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon-btn" id="vNext" aria-label="Next file"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icon-btn" id="vClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <span class="eyebrow" id="vCat"></span>
    <h2 id="vTitle"></h2>
    <p class="viewer__desc" id="vDesc"></p>
    <dl class="meta" id="vMeta"></dl>
    <div class="bg-toggle" id="vBg" role="group" aria-label="Preview background">
      <button data-bg="dark" aria-pressed="true">Dark</button><button data-bg="light">Light</button><button data-bg="check">Checker</button>
    </div>
    <div class="actions">
      <a class="btn btn--accent" id="vDownload" download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</a>
      <button class="btn" id="vCopy"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Copy file link</button>
      <button class="btn" id="vShare"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M8 7l4-4 4 4"/></svg>Copy viewer link</button>
      <a class="btn" id="vOpen" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>Open in new tab</a>
    </div>
    <code class="path" id="vPath"></code>
  </aside>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
